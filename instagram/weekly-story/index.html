<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@500;800;900&display=block">
<title>今週の告知スケジュール ストーリーズ</title>
<script src="lib.js"></script>
<style>
 body{background:#2b2f3a!important;display:flex;flex-direction:column;align-items:center;padding:40px 0}
 svg.slide{width:1080px;height:1920px}
 text.l{text-anchor:start} text.m{font-weight:800}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><defs id="defs"></defs></svg>
<div id="root"></div>
<script>
/* ============================================================
   今週の告知スケジュール（ストーリーズ 1080×1920）
   ・予定を変えるときは下の DAYS を編集
   ・下の方（y=1680〜）はリンクスタンプを置く余白として空けてある
   ・書き出し: python render.py → out/weekly_1019.png
   ============================================================ */
const W=1080,H=1920;
const WEEK='10.19 MON 〜 10.25 SUN';
// [日付, 曜日, 時刻, 色, [[媒体, 内容, ひとこと], ...]]
const DAYS=[
 ['10/21','水','19:00',OR,[['Instagram投稿','当日のプログラム紹介','4つのパークをぜんぶ見せます！']]],
 ['10/23','金','',BLUE,[['特設サイト','小学生・高校生の受付開始','中学生に加えて受付スタート！'],
                       ['特設サイト','参加選手のプロフィール公開','当日会える選手を紹介！'],
                       ['ストーリーズ','カウントダウン スタート','11/23までの毎日をお届け！']]],
];
document.getElementById('defs').innerHTML=DEFS();

function TT(x,y,str,size,fill,stroke='#fff',sw=16){return `<g transform="translate(${x},${y})"><text font-size="${size}" fill="${INK}" stroke="${INK}" stroke-width="${sw}" y="${Math.round(size*.085)}">${str}</text><text font-size="${size}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}">${str}</text></g>`;}
function card(x,y,w,h,fill='#fff',r=34,sw=7){return `<rect x="${x+10}" y="${y+12}" width="${w}" height="${h}" rx="${r}" fill="${INK}"/><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${fill}" stroke="${INK}" stroke-width="${sw}"/>`;}
function tagL(x,y,str,size,bg,fg){const w=str.length*size*1.02+size*1.2,h=size*1.7;return `<rect x="${x}" y="${y-h/2}" width="${w}" height="${h}" rx="${h/2}" fill="${bg}" stroke="${INK}" stroke-width="5"/><text x="${x+w/2}" y="${y}" font-size="${size}" fill="${fg}">${str}</text>`;}

function build(){
 let y=650,body='';
 DAYS.forEach(d=>{
  const ITEM=170,h=Math.max(d[4].length*ITEM+40,320);
  body+=card(70,y,940,h,'#fff',36)
   +`<rect x="70" y="${y}" width="230" height="${h}" rx="36" fill="${d[3]}" stroke="${INK}" stroke-width="7"/><rect x="70" y="${y}" width="230" height="${h}" rx="36" fill="url(#dA)"/>`
   +`<text x="185" y="${y+h/2-(d[2]?56:28)}" font-size="64" fill="#fff" stroke="${INK}" stroke-width="10" style="paint-order:stroke">${d[0]}</text>`
   +`<circle cx="185" cy="${y+h/2+(d[2]?20:48)}" r="34" fill="#fff" stroke="${INK}" stroke-width="5"/><text x="185" y="${y+h/2+(d[2]?20:48)}" font-size="36" fill="${INK}">${d[1]}</text>`
   +(d[2]?`<text x="185" y="${y+h/2+92}" font-size="40" fill="#FFD654" stroke="${INK}" stroke-width="8" style="paint-order:stroke">${d[2]}</text>`:'');
  d[4].forEach((it,i)=>{const iy=y+20+i*ITEM+(d[4].length==1?(h-ITEM-40)/2:0);
   if(i>0)body+=`<line x1="330" y1="${iy}" x2="980" y2="${iy}" stroke="#c9d6ee" stroke-width="4" stroke-dasharray="10 10"/>`;
   body+=tagL(330,iy+42,it[0],26,it[0]=='特設サイト'?NAVY:it[0]=='ストーリーズ'?LOR:OR,'#fff')
    +`<text x="330" y="${iy+100}" class="l" font-size="44" fill="${INK}">${it[1]}</text>`
    +`<text x="332" y="${iy+146}" class="l m" font-size="30" fill="#5a6b8c">${it[2]}</text>`;});
  y+=h+60;});
 return `<svg class="slide" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
  <rect width="${W}" height="${H}" fill="url(#g2)"/><g transform="translate(540,560)">${rays(18,'#fff',.07)}</g><rect width="${W}" height="${H}" fill="url(#dA)"/>
  <text x="540" y="300" font-size="38" fill="#fff">Snow Crystal × 法政大学バドミントン部</text>
  <g transform="translate(540,385)"><rect x="-260" y="-42" width="520" height="84" rx="42" fill="${INK}" stroke="#fff" stroke-width="6"/><text font-size="44" fill="#fff">バドミントンパーク<tspan fill="${LOR}">2026</tspan></text></g>
  ${TT(540,505,'今週の告知スケジュール',86,'#fff',INK,18)}
  <text x="540" y="595" font-size="40" fill="#FFD654" stroke="${INK}" stroke-width="10" style="paint-order:stroke">${WEEK}</text>
  ${body}
  ${use('shuttle',150,y+40,.6,-30)}<text x="560" y="${y+50}" font-size="56" fill="#fff" stroke="${INK}" stroke-width="12" style="paint-order:stroke">お楽しみに！</text>${g(930,y+130,.3,racket(),22)}
 </svg>`;}
const use=(id,x,y,s=1,rot=0)=>`<use href="#${id}" transform="translate(${x},${y}) rotate(${rot}) scale(${s})"/>`;
const g=(x,y,s,inner,rot=0)=>`<g transform="translate(${x},${y}) rotate(${rot}) scale(${s})">${inner}</g>`;
document.getElementById('root').innerHTML=build();
</script></body></html>
