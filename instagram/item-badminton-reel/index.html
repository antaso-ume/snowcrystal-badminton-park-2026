<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>アイテムバドミントン リール</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@800;900&display=block">
</head><body><svg id="root" xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<script src="lib.js"></script><script src="silhouettes.js"></script><script>

// ---------- 場面1：くじ引きボックスが震えて、カードがポーンと飛び出す ----------
let tape='';for(let i=-8;i<10;i++)tape+=`<polygon points="${i*70},160 ${i*70+35},160 ${i*70+5},230 ${i*70-30},230" fill="${INK}"/>`;
let stars='';[[150,330,5],[930,420,4],[210,720,3],[900,900,5],[120,1180,4],[960,1250,3],[320,180,3],[760,160,4]].forEach(([x,y,r])=>stars+=`<circle class="star" cx="${x}" cy="${y}" r="${r}" fill="#fff"/>`);
const FR=rr(-250,-170,500,400,30);
const defs=`<linearGradient id="boxf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8c33"/><stop offset="1" stop-color="#e2600a"/></linearGradient><clipPath id="frontclip"><path d="${FR}"/></clipPath>`;
const POP=[ {card:1,x:225,y:790,rot:-12}, {card:4,x:540,y:700,rot:3}, {card:2,x:855,y:790,rot:12} ];  // 飛び出すカードと止まる位置（card は CONFIG.cards の番号）
let conf='';for(let i=0;i<22;i++)conf+=`<rect class="pc" data-i="${i}" width="${i%3?24:16}" height="${i%3?11:16}" rx="3" fill="${[OR,LBLUE,'#fff',LOR,'#FFD654'][i%5]}"/>`;
let h=`<g id="s0"><rect width="1080" height="1920" fill="url(#v3)"/><rect width="1080" height="1920" fill="url(#dB)" opacity=".5"/>${stars}
<polygon points="380,0 700,0 1010,1500 70,1500" fill="url(#spot)"/><ellipse cx="540" cy="1500" rx="470" ry="78" fill="#fff" opacity=".12"/>
<g id="qs"><text class="q" x="170" y="980" font-size="120" fill="${LOR}">?</text><text class="q" x="915" y="900" font-size="150" fill="#fff">?</text><text class="q" x="880" y="1640" font-size="100" fill="${LBLUE}">?</text><text class="q" x="170" y="1620" font-size="130" fill="${LBLUE}">?</text></g>
<ellipse cx="540" cy="1505" rx="300" ry="34" fill="#020b2c" opacity=".55"/>
<g id="pburst" opacity="0"><polygon points="${star(16,170,330)}" fill="#fff" opacity=".9"/><polygon points="${star(16,110,220)}" fill="#FFD654"/></g>
<g id="pcards">${POP.map((c,i)=>`<use id="pc${i}" href="#card${c.card}"/>`).join('')}</g>${conf}
<g id="box"><g id="lid">${sh("M-250,-170 L-205,-292 L205,-292 L250,-170 Z",'#ffb070','#ff8c33','',-8,-6,10)}
 <ellipse cx="0" cy="-232" rx="122" ry="38" fill="#3a1500" stroke="${INK}" stroke-width="8"/></g>
 <path d="${FR}" fill="url(#boxf)"/><g clip-path="url(#frontclip)"><rect x="-250" y="-170" width="500" height="26" fill="#fff" opacity=".25"/><rect x="170" y="-170" width="80" height="400" fill="#8c3b00" opacity=".18"/><rect x="-250" y="160" width="500" height="70" fill="#fff"/>${tape}</g>
 <path d="${FR}" fill="none" stroke="${INK}" stroke-width="10"/>
 <text x="0" y="-10" font-size="270" fill="${INK}" stroke="${INK}" stroke-width="20" transform="translate(0,18)">?</text><text x="0" y="-10" font-size="270" fill="#fff" stroke="${INK}" stroke-width="20">?</text></g>
<g id="shake3" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round"><path d="M200,1080 q-40,60 0,120"/><path d="M150,1110 q-26,34 0,68"/><path d="M880,1080 q40,60 0,120"/><path d="M930,1110 q26,34 0,68"/></g>
${T('t0a',540,300,'法政大学 と Snow Crystal の',60,'#fff','#031340',14,'#031340')}${T('t0b',540,440,'選手が使うのは…?',112,LOR,'#031340',18,'#031340')}</g>`;
function s0(u){
  const POPT=1.6;                                   // ポーンと出る時刻（秒）
  const k=cl((u-.45)/.9), shakeOn=u<POPT;           // だんだん激しく震える
  const amp=shakeOn?k*(6+16*k):0, sx=amp*Math.sin(u*48), rot=amp*.18*Math.sin(u*48+1);
  const squash=u>POPT-.18&&u<POPT?1-.1*Math.sin(Math.PI*(u-POPT+.18)/.18):(u>=POPT&&u<POPT+.25?1+.08*Math.sin(Math.PI*(u-POPT)/.25):1);
  A('box','transform',`translate(${540+sx},1270) rotate(${rot}) scale(${2-squash},${squash})`);
  const lp=cl((u-POPT)/.7);                          // ふたが飛んでいく
  A('lid','transform',lp>0?`translate(${260*lp},${-520*lp+380*lp*lp}) rotate(${70*lp})`:'');A('lid','opacity',1-cl((lp-.35)/.3));
  A('shake3','opacity',shakeOn?k*(.5+.5*Math.sin(u*46)):0);
  const b=(u-POPT)/.35;A('pburst','opacity',b<0?0:1-cl((b-.4)/.6));A('pburst','transform',`translate(540,1020) rotate(${u*40}) scale(${b<0?.001:.4+.9*eo(b)})`);
  POP.forEach((c,i)=>{const p=(u-POPT-i*.07)/.55;     // 箱から飛び出して、少し跳ねて止まる
    if(p<=0){A('pc'+i,'opacity',0);return;}
    const q=back(p), x=540+(c.x-540)*q, y=1020+(c.y-1020)*q-90*Math.sin(Math.PI*cl(p)), s=.1+.48*q;
    const fl=6*Math.sin(u*3+i)*cl(p-1);                 // 止まったあとはふわふわ
    A('pc'+i,'opacity',1);A('pc'+i,'transform',`translate(${x},${y+fl}) rotate(${c.rot*q+(1-cl(p))*-200}) scale(${s})`);});
  document.querySelectorAll('.pc').forEach(r=>{const i=+r.dataset.i,p=(u-POPT)/1.2;
    if(p<=0){r.setAttribute('opacity',0);return;}
    const a=-Math.PI*(.12+.76*(i/21)),v=700+(i*97)%500;
    r.setAttribute('opacity',1-cl((p-.7)/.3));r.setAttribute('transform',`translate(${540+Math.cos(a)*v*p},${1020+Math.sin(a)*v*p+700*p*p}) rotate(${i*40+u*400})`);});
  document.querySelectorAll('.q').forEach((q,i)=>{q.setAttribute('opacity',.35+.5*Math.abs(Math.sin(u*3+i*1.3)));q.setAttribute('transform',`translate(0,${-20*u+10*Math.sin(u*4+i)})`);});
  document.querySelectorAll('.star').forEach((s,i)=>s.setAttribute('opacity',.3+.6*Math.abs(Math.sin(u*5+i))));
  pop('t0a',u,.1);pop('t0b',u,.25,.32);
}

// =====================================================================
//  CONFIG ― 動画全体の長さと、カードの場面の調整
// =====================================================================
const CONFIG = {
  duration: 10, fps: 30,
  cards: [                                   // 流れる順番（key は silhouettes.js の名前）
    { key: 'shamoji',    name: 'しゃもじ' },
    { key: 'houki',      name: 'ほうき' },
    { key: 'otama',      name: 'おたま' },
    { key: 'bowl',       name: '片手ボウル' },
    { key: 'slipper',    name: 'スリッパ', scale: 0.92 },
    { key: 'colander',   name: 'ざる' },
    { key: 'steel_bowl', name: 'ボウル', scale: 0.9 },
    { key: 'spoon',      name: 'スプーン', secret: true },
  ],
  showNames: false,
  card: { w: 400, h: 580 }, gap: 70,
  speed: 380,          // 流れる速さ（px/秒）
  startX: -516,        // 場面の始まりでの No.01 の位置。場面の最後に「最高難易度」カードが来るように調整
  rowY: 1010, tilt: 4, bob: 12,
  backRow: { show: true, y: 1590, scale: 0.55, opacity: 0.28, speedRatio: 0.6 },
  secretLabel: '最高難易度?!',
  scenes: { box: 0, cards: 3, end: 8.3 },   // 各場面の開始秒
};
// =====================================================================

function silhouette(key, cx, cy, boxW, boxH, fill) {
  const s = SILHOUETTES[key], k = Math.min(boxW / s.w, boxH / s.h);
  return `<path d="${s.d}" fill="${fill}" fill-rule="evenodd" transform="translate(${cx - s.w * k / 2},${cy - s.h * k / 2}) scale(${k})"/>`;
}
function card(item, index) {
  const { w, h } = CONFIG.card, x = -w / 2, y = -h / 2, secret = !!item.secret;
  const label = secret ? CONFIG.secretLabel : (CONFIG.showNames ? item.name : '???');
  const sc = item.scale ?? 1, no = String(index + 1).padStart(2, '0'), lw = Math.max(170, label.length * 46 + 70);
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="40" fill="${secret ? INK : '#fff'}" stroke="${INK}" stroke-width="10" filter="url(#cshadow)"/>
    <rect x="${x + 22}" y="${y + 22}" width="${w - 44}" height="${h - 44}" rx="26" fill="url(#${secret ? 'panelSecret' : 'panel'})"/>
    <rect x="${x + 22}" y="${y + 22}" width="${w - 44}" height="${h - 44}" rx="26" fill="url(#${secret ? 'dotsOrange' : 'dotsBlue'})"/>
    <circle cx="0" cy="-40" r="150" fill="url(#${secret ? 'glowSecret' : 'glow'})"/>
    ${silhouette(item.key, 0, -40, 290 * sc, 360 * sc, secret ? LOR : INK)}
    ${secret ? `<rect x="${x + 22}" y="${y + 22}" width="${w - 44}" height="${h - 44}" rx="26" fill="none" stroke="${LOR}" stroke-width="5" stroke-dasharray="16 12"/>` : ''}
    <circle cx="${x + 62}" cy="${y + 62}" r="34" fill="${secret ? '#e23d2e' : OR}" stroke="${INK}" stroke-width="7"/><text x="${x + 62}" y="${y + 60}" font-size="44" fill="#fff">?</text>
    <text x="${-x - 70}" y="${y + 62}" font-size="34" fill="${secret ? LOR : INK}">No.${no}</text>
    <g class="txt"><rect x="${-lw / 2}" y="${h / 2 - 98}" width="${lw}" height="66" rx="33" fill="${secret ? OR : INK}"/><text x="0" y="${h / 2 - 67}" font-size="${secret ? 36 : 40}" fill="#fff">${label}</text></g>`;
}
const NC = CONFIG.cards.length, STEP = CONFIG.card.w + CONFIG.gap, LOOP = NC * STEP;
const cardDefs = `<linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d6e4fb"/></linearGradient>
  <linearGradient id="panelSecret" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#143a9e"/><stop offset="1" stop-color="#031340"/></linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowSecret"><stop offset="0" stop-color="${OR}" stop-opacity=".45"/><stop offset="1" stop-color="${OR}" stop-opacity="0"/></radialGradient>
  ${dotsPat('dotsBlue', BLUE, .08, 34, 3.5)}${dotsPat('dotsOrange', LOR, .12, 34, 3.5)}
  <filter id="cshadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#031a52" flood-opacity=".45"/></filter>
  ${CONFIG.cards.map((c, i) => `<g id="card${i}">${card(c, i)}</g>`).join('')}`;
let streaks = '', backRow = '', frontRow = '';
for (let i = 0; i < 9; i++) streaks += `<rect class="streak" data-i="${i}" y="${640 + (i * 137) % 900}" width="${120 + (i * 53) % 160}" height="10" rx="5" fill="#fff" opacity=".22"/>`;
for (let i = 0; i < NC; i++) {
  let j = (i + 3) % NC; while (CONFIG.cards[j].secret) j = (j + 1) % NC;   // 奥の列に「最高難易度」は出さない
  backRow += `<use id="cb${i}" href="#card${j}"/>`; frontRow += `<use id="cf${i}" href="#card${i}"/>`;
}
h+=`<g id="s1"><rect width="1080" height="1920" fill="url(#g2)"/><g id="pat2"><rect x="-200" width="1500" height="1920" fill="url(#dB)"/></g>
<g id="giantg" opacity=".35"><use href="#giant"/></g>${streaks}
<g id="backRow" opacity="${CONFIG.backRow.opacity}" display="${CONFIG.backRow.show ? 'inline' : 'none'}">${backRow}</g><g id="frontRow">${frontRow}</g>
<g id="sp2">${spark(110,640,34)}${spark(980,600,24,LOR)}${spark(960,1400,22)}${spark(90,1380,18,LOR)}</g>
${T('t2a',540,310,'何が出るかは、',90,'#fff',INK,16)}${T('t2b',540,460,'運しだい',150,LOR,INK,18)}</g>`;
const wrapX = x => ((x + STEP) % LOOP + LOOP) % LOOP - STEP;
function s1(u){
  A('pat2','transform',`translate(${-(u*40)%54},0)`);
  A('giantg','transform',`translate(${2500-600*u},900) rotate(14)`);
  document.querySelectorAll('.streak').forEach(s=>{const i=+s.dataset.i;s.setAttribute('x',1200-((u*(900+i*60)+i*400)%1600));});
  const br=CONFIG.backRow;
  for(let i=0;i<NC;i++){
    const x=wrapX(CONFIG.startX+i*STEP-CONFIG.speed*u), rot=CONFIG.tilt*Math.sin(u*2.2+i*1.3);
    A('cf'+i,'transform',`translate(${x},${CONFIG.rowY+CONFIG.bob*Math.sin(u*3+i*1.7)}) rotate(${rot})`);
    const bx=wrapX(CONFIG.startX+200+i*STEP-CONFIG.speed*br.speedRatio*u);
    A('cb'+i,'transform',`translate(${540+(bx-540)*br.scale},${br.y}) scale(${br.scale}) rotate(${-rot})`);
  }
  A('sp2','opacity',.55+.45*Math.sin(u*7));pop('t2a',u,.12);pop('t2b',u,.26,.32);
}



// ---------- 場面3：エンディング ----------
h+=endCard(2,`<use href="#shuttle" transform="translate(560,1585) rotate(-105) scale(1.1)"/>`);   // 下の飾り（アイテムはネタバレになるので出さない）
h=h.replace(/<\/g>$/, `${T('t4x',540,395,'法政大学・Snow Crystal の選手に',52,INK,'#fff',12,'')}${T('t4y',540,500,'君は勝てるか!?',120,OR,'#fff',20,INK)}</g>`);
function s2(u){renderEnd(u);A('st4','display','none');pop('t4x',u,.02);pop('t4y',u,.12,.32);}
{const S=CONFIG.scenes;build(defs+cardDefs,h,[[S.box,s0],[S.cards,s1],[S.end,s2]]);}

// ---------- プレビュー（ブラウザで開いたとき）。書き出し時（?render）は使わない ----------
if (!new URLSearchParams(location.search).has('render')) {
  document.body.insertAdjacentHTML('afterbegin','<div id="ctl" style="display:flex;gap:12px;align-items:center;color:#fff;font:14px sans-serif;padding:10px;justify-content:center"><button id="play">⏸ 一時停止</button><input id="seek" type="range" min="0" step="0.01" style="width:320px"><span id="tm">0.00s</span></div>');
  const svg=document.getElementById('root'), seek=document.getElementById('seek'), btn=document.getElementById('play');
  seek.max=CONFIG.duration;
  const fit=()=>{const k=Math.min(1,(innerHeight-60)/1920);svg.style.width=1080*k+'px';svg.style.height=1920*k+'px';svg.style.margin='0 auto';};
  addEventListener('resize',fit);fit();
  let playing=true,t0=performance.now(),t=0;
  btn.onclick=()=>{playing=!playing;btn.textContent=playing?'⏸ 一時停止':'▶ 再生';t0=performance.now()-t*1000;};
  seek.oninput=()=>{t=+seek.value;t0=performance.now()-t*1000;render(t);};
  (function loop(now){if(playing){t=((now-t0)/1000)%CONFIG.duration;seek.value=t;render(t);}document.getElementById('tm').textContent=t.toFixed(2)+'s';requestAnimationFrame(loop);})(performance.now());
}
</script></body></html>
